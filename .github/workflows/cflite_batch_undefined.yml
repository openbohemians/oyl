# ClusterFuzzLite batch fuzzing under UndefinedBehaviorSanitizer: an hour on all of
# the runner's cores. While the repository variable FUZZ_CHAIN is "on",
# a run that passes starts the next (the Next job), so the runs follow
# back to back; a failure stops the chain, and so does
# `gh variable set FUZZ_CHAIN --body off`. The schedule, every 6 hours,
# is the floor, and GitHub starts only some of those. A run that comes
# due while one is going waits for it (the concurrency group). The corpus
# carries over between runs (kept as GitHub artifacts), so fuzzing
# accumulates; crashes are uploaded as artifacts. Each sanitizer has its
# own workflow because both upload crashes under the same artifact name,
# and a name must be unique within a run. Pruning and coverage run in
# cflite_cron.yml.
name: ClusterFuzzLite batch fuzzing (undefined)
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
permissions: read-all
concurrency:
  group: cflite-batch-undefined
  cancel-in-progress: false
jobs:
  BatchFuzzing:
    runs-on: ubuntu-latest
    steps:
    - name: Build fuzzers (undefined)
      uses: google/clusterfuzzlite/actions/build_fuzzers@v1
      with:
        language: c
        sanitizer: undefined
    - name: Run fuzzers (undefined)
      uses: google/clusterfuzzlite/actions/run_fuzzers@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fuzz-seconds: 3600
        mode: 'batch'
        sanitizer: undefined
        parallel-fuzzing: true
  Next:
    needs: BatchFuzzing
    if: vars.FUZZ_CHAIN == 'on'
    runs-on: ubuntu-latest
    permissions:
      actions: write   # start the next run
    steps:
    - name: Start the next run
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run cflite_batch_undefined.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
